<template>
    <lightning-card title="Enrollments" icon-name="standard:education">
        <div class="slds-p-around_medium">
            <template if:true={selectedStudentId}>
                <template if:true={enrollments}>
                    <template for:each={enrollments} for:item="enrollment">
                        <p key={enrollment.Id}>
                            {enrollment.Student__r.Name} — 
                            {enrollment.Course__r.Name} — 
                            {enrollment.Status__c}
                        </p>
                    </template>
                </template>
                <template if:true={error}>
                    <p class="slds-text-color_error">{error}</p>
                </template>
            </template>
            <template if:false={selectedStudentId}>
                <p class="slds-text-color_weak">Select a student to view enrollments.</p>
            </template>
        </div>
    </lightning-card>
</template>
